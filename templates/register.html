{% extends "base.html" %}
{% block title %}Register | DiaPredict{% endblock %}
{% block content %}
<div style="max-width: 520px; margin: 2rem auto;">
  <div class="page-head" style="text-align: center; margin-bottom: 1.5rem;">
    <div class="eyebrow">CREATE AN ACCOUNT</div>
    <h1 style="font-size: 2.2rem;">Register</h1>
    <p>Sign up to track and audit diabetes machine learning predictions.</p>
  </div>

  <div class="form-card" style="padding: 2.5rem 2rem;">
    <form method="POST" action="{{ url_for('register') }}">
      <div style="margin-bottom: 1.2rem;">
        <label style="display: block; margin-bottom: 0.4rem; color: #cbd5e1; font-weight: 600; font-size: 0.9rem;">
          Full Name
        </label>
        <input 
          type="text" 
          name="full_name" 
          placeholder="e.g. Dr. Alex Morgan" 
          required 
          style="width: 100%; padding: 0.75rem 1rem; border-radius: 10px; background: #071525; border: 1px solid #28445f; color: #fff; font-size: 0.95rem;"
        >
      </div>

      <div style="margin-bottom: 1.2rem;">
        <label style="display: block; margin-bottom: 0.4rem; color: #cbd5e1; font-weight: 600; font-size: 0.9rem;">
          Username
        </label>
        <input 
          type="text" 
          name="username" 
          placeholder="Choose a username" 
          required 
          style="width: 100%; padding: 0.75rem 1rem; border-radius: 10px; background: #071525; border: 1px solid #28445f; color: #fff; font-size: 0.95rem;"
        >
      </div>

      <div style="margin-bottom: 1.2rem;">
        <label style="display: block; margin-bottom: 0.4rem; color: #cbd5e1; font-weight: 600; font-size: 0.9rem;">
          Email Address
        </label>
        <input 
          type="email" 
          name="email" 
          placeholder="e.g. alex@example.com" 
          style="width: 100%; padding: 0.75rem 1rem; border-radius: 10px; background: #071525; border: 1px solid #28445f; color: #fff; font-size: 0.95rem;"
        >
      </div>

      <div style="margin-bottom: 1.2rem;">
        <label style="display: block; margin-bottom: 0.4rem; color: #cbd5e1; font-weight: 600; font-size: 0.9rem;">
          Password
        </label>
        <input 
          type="password" 
          name="password" 
          placeholder="At least 6 characters" 
          required 
          minlength="6"
          style="width: 100%; padding: 0.75rem 1rem; border-radius: 10px; background: #071525; border: 1px solid #28445f; color: #fff; font-size: 0.95rem;"
        >
      </div>

      <div style="margin-bottom: 1.5rem;">
        <label style="display: block; margin-bottom: 0.4rem; color: #cbd5e1; font-weight: 600; font-size: 0.9rem;">
          Confirm Password
        </label>
        <input 
          type="password" 
          name="confirm_password" 
          placeholder="Re-enter password" 
          required 
          minlength="6"
          style="width: 100%; padding: 0.75rem 1rem; border-radius: 10px; background: #071525; border: 1px solid #28445f; color: #fff; font-size: 0.95rem;"
        >
      </div>

      <button class="btn primary full" type="submit" style="margin-top: 0.5rem; font-size: 1rem;">
        Create Account →
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: #94a3b8;">
      Already have an account? 
      <a href="{{ url_for('login') }}" style="color: #38bdf8; text-decoration: none; font-weight: 600;">
        Sign In here
      </a>
    </div>
  </div>
</div>
{% endblock %}
